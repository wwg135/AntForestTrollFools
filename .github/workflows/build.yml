name: Build AntForest

on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@main
        with:
          submodules: true

      - name: Build dylib
        run: |
          make all

      - name: Run tests
        run: |
          make test

      - name: Install dpkg
        run: |
          brew install dpkg

      - name: Package deb
        run: |
          mkdir -p Packages
          rm -f Packages/*.deb

          PKG=build/rootless-package
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/var/jb/Library/MobileSubstrate/DynamicLibraries"

          cp antforest/Package/DEBIAN/control "$PKG/DEBIAN/control"
          cp antforest/Package/Library/MobileSubstrate/DynamicLibraries/antforest.plist "$PKG/var/jb/Library/MobileSubstrate/DynamicLibraries/antforest.plist"
          cp build/AntForestPort-Ocean.dylib "$PKG/var/jb/Library/MobileSubstrate/DynamicLibraries/antforest.dylib"

          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64/' "$PKG/DEBIAN/control"
          rm -f "$PKG/DEBIAN/control.bak"

          VER=$(grep '^Version:' "$PKG/DEBIAN/control" | awk '{print $2}')
          dpkg-deb -b "$PKG" "Packages/com.vknote.antforest_${VER}_iphoneos-arm64.deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: AntForest
          path: |
            ${{ github.workspace }}/Packages/*.deb
